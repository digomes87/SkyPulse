name: skypulse

# Local mode stack. Later milestones add Spark, Airflow, MLflow and observability services.

x-pipeline-env: &pipeline-env
  SKYPULSE_INGESTION__REPLAY: "true"
  SKYPULSE_KAFKA__BOOTSTRAP_SERVERS: kafka:19092
  SKYPULSE_AWS__ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

x-producer: &producer
  profiles: ["pipeline"]
  image: skypulse-producer:local
  depends_on:
    kafka: { condition: service_healthy }
  environment: *pipeline-env

x-spark: &spark
  profiles: ["pipeline"]
  image: skypulse-spark:local
  depends_on:
    kafka: { condition: service_healthy }
    localstack: { condition: service_healthy }
  environment: *pipeline-env

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: skypulse-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: neD4No3rR3KD34qQDISbKA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24

  kafka-init:
    image: apache/kafka:4.1.0
    container_name: skypulse-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/local/kafka:/init:ro
    entrypoint: ["/bin/bash", "/init/create-topics.sh", "kafka:19092", "/init/topics.txt"]
    restart: "no"

  localstack:
    # 4.14.0 is the last release that starts without an auth token. To use a newer
    # image, set LOCALSTACK_IMAGE and LOCALSTACK_AUTH_TOKEN in .env (see ADR 0004).
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:4.14.0}
    container_name: skypulse-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sns,sqs,lambda,dynamodb,sts,iam
      AWS_DEFAULT_REGION: eu-west-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SKYPULSE_LAKE_BUCKET_PREFIX: ${SKYPULSE_LAKE__BUCKET_PREFIX:-skypulse}
    volumes:
      - ./infra/local/localstack/init-aws.sh:/etc/localstack/init/ready.d/10-init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket \"$${SKYPULSE_LAKE_BUCKET_PREFIX}-checkpoints\""]
      interval: 5s
      timeout: 10s
      retries: 24

  # --- pipeline (profile "pipeline"): replay producers and streaming jobs -----------------
  # Only one service per image builds it; the others reuse the tag.

  producer-states:
    <<: *producer
    build: { context: ., target: producer }
    command: ["states"]

  producer-schedules:
    <<: *producer
    command: ["schedules"]

  producer-metar:
    <<: *producer
    command: ["metar"]

  spark-bronze:
    <<: *spark
    build: { context: ., target: spark }
    command: ["bronze", "--master", "local[2]"]

  spark-silver:
    <<: *spark
    command: ["silver", "--master", "local[2]"]
