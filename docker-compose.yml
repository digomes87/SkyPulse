name: skypulse

# Local mode stack. Later milestones add Spark, Airflow, MLflow and observability services.

x-pipeline-env: &pipeline-env
  SKYPULSE_INGESTION__REPLAY: "true"
  SKYPULSE_KAFKA__BOOTSTRAP_SERVERS: kafka:19092
  SKYPULSE_AWS__ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

x-airflow: &airflow
  profiles: ["orchestration"]
  image: skypulse-airflow:local
  depends_on:
    postgres: { condition: service_healthy }
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: skypulse-local-only-not-a-secret
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Shared DAG helpers (skypulse_tasks.py) live next to the DAGs; task processes need them too.
    PYTHONPATH: /opt/airflow/dags
    # Passed through to the task containers by airflow/dags/skypulse_tasks.py
    SKYPULSE_DOCKER_URL: tcp://docker-proxy:2375
    SKYPULSE_DOCKER_NETWORK: skypulse_default
    SKYPULSE_INGESTION__REPLAY: "true"
    SKYPULSE_KAFKA__BOOTSTRAP_SERVERS: kafka:19092
    SKYPULSE_AWS__ENDPOINT_URL: http://localstack:4566
    SKYPULSE_S3_ENDPOINT: localstack:4566
    SKYPULSE_S3_URL_STYLE: path
    SKYPULSE_S3_USE_SSL: "false"
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro

x-producer: &producer
  profiles: ["pipeline"]
  image: skypulse-producer:local
  depends_on:
    kafka: { condition: service_healthy }
  environment: *pipeline-env

x-spark: &spark
  profiles: ["pipeline"]
  image: skypulse-spark:local
  depends_on:
    kafka: { condition: service_healthy }
    localstack: { condition: service_healthy }
  environment: *pipeline-env

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: skypulse-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: neD4No3rR3KD34qQDISbKA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24

  kafka-init:
    image: apache/kafka:4.1.0
    container_name: skypulse-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/local/kafka:/init:ro
    entrypoint: ["/bin/bash", "/init/create-topics.sh", "kafka:19092", "/init/topics.txt"]
    restart: "no"

  localstack:
    # 4.14.0 is the last release that starts without an auth token. To use a newer
    # image, set LOCALSTACK_IMAGE and LOCALSTACK_AUTH_TOKEN in .env (see ADR 0004).
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:4.14.0}
    container_name: skypulse-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sns,sqs,lambda,dynamodb,sts,iam
      AWS_DEFAULT_REGION: eu-west-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SKYPULSE_LAKE_BUCKET_PREFIX: ${SKYPULSE_LAKE__BUCKET_PREFIX:-skypulse}
    volumes:
      - ./infra/local/localstack/init-aws.sh:/etc/localstack/init/ready.d/10-init-aws.sh:ro
      # Lambda functions run in sibling containers started through the Docker socket.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # The claims table is the last resource the init script creates.
      test: ["CMD-SHELL", "awslocal dynamodb describe-table --table-name eu261-claims > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 24

  # --- orchestration (profile "orchestration"): Airflow 3 with LocalExecutor ---------------

  postgres:
    profiles: ["orchestration"]
    image: postgres:17.6
    container_name: skypulse-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 12

  # Narrow Docker API for the DockerOperator instead of mounting the socket into Airflow.
  docker-proxy:
    profiles: ["orchestration"]
    image: tecnativa/docker-socket-proxy:v0.4.1
    container_name: skypulse-docker-proxy
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  airflow-init:
    <<: *airflow
    build: { context: infra/airflow }
    container_name: skypulse-airflow-init
    command: ["bash", "-c", "airflow db migrate"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    container_name: skypulse-airflow-apiserver
    command: ["api-server"]
    ports:
      - "${SKYPULSE_AIRFLOW_PORT:-8088}:8080"
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      retries: 18

  airflow-scheduler:
    <<: *airflow
    container_name: skypulse-airflow-scheduler
    command: ["scheduler"]
    depends_on:
      airflow-init: { condition: service_completed_successfully }
      docker-proxy: { condition: service_started }

  airflow-dag-processor:
    <<: *airflow
    container_name: skypulse-airflow-dag-processor
    command: ["dag-processor"]
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  airflow-triggerer:
    <<: *airflow
    container_name: skypulse-airflow-triggerer
    command: ["triggerer"]
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  dbt:
    profiles: ["pipeline"]
    build: { context: ., target: dbt }
    image: skypulse-dbt:local
    environment:
      <<: *pipeline-env
      SKYPULSE_SILVER_ROOT: s3://skypulse-silver
      SKYPULSE_S3_ENDPOINT: localstack:4566
      SKYPULSE_S3_URL_STYLE: path
      SKYPULSE_S3_USE_SSL: "false"
    volumes:
      - gold:/gold
    command: ["build"]

  # --- pipeline (profile "pipeline"): replay producers and streaming jobs -----------------
  # Only one service per image builds it; the others reuse the tag.

  producer-states:
    <<: *producer
    build: { context: ., target: producer }
    command: ["states"]

  producer-schedules:
    <<: *producer
    command: ["schedules"]

  producer-metar:
    <<: *producer
    command: ["metar"]

  spark-bronze:
    <<: *spark
    build: { context: ., target: spark }
    command: ["bronze", "--master", "local[2]"]

  spark-silver:
    <<: *spark
    command: ["silver", "--master", "local[2]"]

volumes:
  airflow-db:
  gold:
