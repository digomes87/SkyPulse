[project]
name = "skypulse"
version = "0.1.0"
description = "Real-time flight disruption and EU261 exposure platform for European air traffic"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.16.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rfc3339-validator>=0.1.4",
    "structlog>=24.4",
]

[project.optional-dependencies]
spark = [
    "boto3>=1.35",
    "delta-spark==4.0.1",
    "pyspark==4.0.1",
]

[dependency-groups]
dbt = [
    "dbt-core>=1.12,<1.12.6",
    "dbt-duckdb==1.11.0",
    "duckdb>=1.5,<1.6",
    "pytz>=2026.5",
]
dev = [
    "boto3>=1.35",
    "hypothesis>=6.169.1",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skypulse"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "skypulse/_contracts"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT", "RET", "ARG", "TID", "DTZ", "T20"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ARG", "PLR0913"]
"scripts/**" = ["T20"]
"airflow/tests/**" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "boto3.*", "delta.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the local docker-compose stack (make up)",
    "spark: starts a local Spark session (needs Java 17+)",
]

[tool.coverage.run]
source = ["skypulse"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
