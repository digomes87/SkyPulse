name: skypulse
version: "0.1.0"
config-version: 2
profile: skypulse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
docs-paths: ["models"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  on_time_threshold_minutes: 15
  eu261_delay_threshold_minutes: 180
  dim_date_start: "2026-10-01"
  dim_date_end: "2027-01-01"

models:
  skypulse:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: gold
    aggregates:
      +materialized: table
      +schema: gold
