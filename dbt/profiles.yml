# Local target: DuckDB reading the silver Delta tables in place (delta extension).
# A Databricks target is added with the AWS deployment (M8).
skypulse:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('SKYPULSE_DUCKDB_PATH', 'target/skypulse.duckdb') }}"
      threads: 4
      extensions: [delta]
      settings:
        TimeZone: UTC
